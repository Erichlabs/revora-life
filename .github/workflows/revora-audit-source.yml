name: Revora source audit
on:
  push:
    branches: [refine/public-readiness-20260927]
    paths: [.github/workflows/revora-audit-source.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve reviewed source and public live-page comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/revora-audit
          test "$(git rev-parse HEAD^)" = f5b1735a8d00041d95f5844c2bbb2a960d42d59c
          git archive --format=tar.gz -o /tmp/revora-audit/source.tar.gz HEAD
          git ls-tree -r --long HEAD > /tmp/revora-audit/source-tree.txt
          git rev-parse HEAD > /tmp/revora-audit/sha.txt
          python3 - <<'PY'
          import urllib.request, pathlib, json, hashlib
          report = pathlib.Path('/tmp/revora-audit')
          paths = ['index.html','about.html','contact.html','suppliers.html','checkout.html','privacy-policy.html','terms-of-service.html','styles.css','assets/js/cart.js']
          results = []
          for path in paths:
              url = 'https://revoralife.com/' + ('' if path == 'index.html' else path)
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'RevoraLife-owner-authorised-readonly-audit/1.0'})
                  with urllib.request.urlopen(req, timeout=25) as response:
                      content = response.read(2000000)
                      status = response.status
                  (report / ('live-' + path.replace('/', '-'))).write_bytes(content)
                  source = pathlib.Path('05_Preview') / path
                  results.append({'url': url, 'status': status, 'bytes':len(content), 'sha256':hashlib.sha256(content).hexdigest(), 'matches05Preview': source.exists() and source.read_bytes() == content})
              except Exception as error:
                  results.append({'url':url, 'error':str(error)})
          (report / 'public-comparison.json').write_text(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: revora-source-audit
          path: /tmp/revora-audit
          retention-days: 7
          if-no-files-found: error
